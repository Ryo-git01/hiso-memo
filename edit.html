from pathlib import Path

edit_html = """<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>編集モード</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="editPage">

<div class="editContainer">

<h1>編集モード</h1>

<p>コース</p>

<select id="courseInput" onchange="updateCityList()">
</select>

<br><br>

<p>エリア</p>

<select id="cityInput" onchange="updateTownList()">
</select>

<br><br>

<p>地区</p>

<select id="townInput">
</select>

<br><br>

<p>住所</p>

<input id="addressInput" placeholder="住所">

<br><br>

<p>配送先メモ</p>

<textarea id="memoInput" rows="5" cols="30"></textarea>
<br><br>

<button id="photoButton" type="button">
    📷 +追加
</button>

<br><br>

<div class="photoPreview">

    <div class="photoItem">
        <img id="photo1">
    </div>

    <div class="photoItem">
        <img id="photo2">
    </div>

    <div class="photoItem">
        <img id="photo3">
    </div>

    <div class="photoItem">
        <img id="photo4">
    </div>

</div>

<input
    type="file"
    id="photoInput"
    accept="image/*"
    style="display:none;">

<div class="editButtonGrid">

    <button class="saveButton" onclick="saveMemo()">
        ✅ 編集完了
    </button>

    <button class="deleteButton"
            onclick="location.href='delete-confirm.html'">
        🗑 削除
    </button>

    <button class="backButton"
            onclick="location.href='detail.html'">
        🔙 戻る
    </button>

</div>

</div>

<script src="coursedata.js"></script>

<script src="towndata.js"></script>

<script src="compress-photo.js"></script>


<script>

const deliveries =

    JSON.parse(localStorage.getItem("deliveries")) || [];

const currentDeliveryId =

    Number(localStorage.getItem("currentDeliveryId"));

const delivery =

    deliveries.find(function(item) {

        return item.id === currentDeliveryId;

    });
    
function updateCourseList() {

    const courseSelect =

        document.getElementById("courseInput");

    courseSelect.innerHTML = "";

    Object.keys(courseData).forEach(function(course) {

        const option =

            document.createElement("option");

        option.value = course;

        option.textContent = course;

        courseSelect.appendChild(option);

    });

}

function updateCityList() {

    const course =

        document.getElementById("courseInput").value;

    const citySelect =

        document.getElementById("cityInput");

    citySelect.innerHTML = "";

    const cities =

        courseData[course] || [];

    cities.forEach(function(city) {

        const option =

            document.createElement("option");

        option.value = city;

        option.textContent = city;

        citySelect.appendChild(option);

    });

    updateTownList();

}

function updateTownList() {

    const city =

        document.getElementById("cityInput").value;

    const townSelect =

        document.getElementById("townInput");

    townSelect.innerHTML = "";

    const towns =

        townData[city] || [];

    towns.forEach(function(town) {

        const option =

            document.createElement("option");

        option.value = town;

        option.textContent = town;

        townSelect.appendChild(option);

    });

    if (!towns.includes("その他")) {

        const option =

            document.createElement("option");

        option.value = "その他";

        option.textContent = "その他";

        townSelect.appendChild(option);

    }

}

function showPhotos() {

    const photoElements = [

        document.getElementById("photo1"),

        document.getElementById("photo2"),

        document.getElementById("photo3"),

        document.getElementById("photo4")

    ];

    photoElements.forEach(function (photo) {

        photo.removeAttribute("src");

    });

    if (!Array.isArray(delivery.photos)) {

        return;

    }

    delivery.photos.forEach(function (photo, index) {
        
        photoElements[index].src = photo;

        photoElements[index].onclick = function () {

    localStorage.setItem(

        "selectedPhotoIndex",

        index

    );

    location.href = "photodelete.html";

};

    });

}

function showDeliveryData() {

    if (!delivery) {

        alert("編集する配送先データが見つかりません。");

        location.href = "index.html";

        return;

    }

    updateCourseList();

    if (delivery.course && courseData[delivery.course]) {

        document.getElementById("courseInput").value =

            delivery.course;

    }

    updateCityList();

    const selectedCourse =

        document.getElementById("courseInput").value;

    const cities =

        courseData[selectedCourse] || [];

    if (delivery.city && cities.includes(delivery.city)) {

        document.getElementById("cityInput").value =

            delivery.city;

    }

    updateTownList();

    const towns =

        townData[delivery.city] || [];

    if ( delivery.town &&

        (

            towns.includes(delivery.town) ||

            delivery.town === "その他"

        )

    ) {

        document.getElementById("townInput").value =

            delivery.town;

    }

    document.getElementById("addressInput").value =

        delivery.address || "";

    document.getElementById("memoInput").value =

        delivery.memo || "";

        showPhotos();

}

function saveMemo() {

    if (!delivery) {

        alert("保存する配送先データが見つかりません。");

        return;

    }

    delivery.course =

        document.getElementById("courseInput").value;

    delivery.city =

        document.getElementById("cityInput").value;

    delivery.town =

        document.getElementById("townInput").value;

    delivery.address =

        document.getElementById("addressInput").value;

    delivery.memo =

        document.getElementById("memoInput").value;


    localStorage.setItem(

        "deliveries",

        JSON.stringify(deliveries)

    );

    localStorage.setItem(

        "currentDeliveryId",

        delivery.id

    );

    location.href = "detail.html";

}

showDeliveryData();

document.getElementById("photoButton")
.addEventListener("click", function () {

    const photoCount =

        Array.isArray(delivery.photos)

            ? delivery.photos.length

            : 0;

    if (photoCount >= 4) {

        alert("写真は最大4枚までです。");

        return;

    }

    document.getElementById("photoInput").click();

});

document.getElementById("photoInput")
.addEventListener("change", async function (event) {

    const selectedPhotos =

        Array.from(event.target.files);

    const photoCount =

        Array.isArray(delivery.photos)

            ? delivery.photos.length

            : 0;

    const remainingCount =

        4 - photoCount;

    const targetPhotos =

        selectedPhotos.slice(0, remainingCount);

const compressedPhotos =

    await Promise.all(

        targetPhotos.map(function (file) {

            return compressPhoto(file);

        })

    );

if (!Array.isArray(delivery.photos)) {

    delivery.photos = [];

}

delivery.photos.push(

    ...compressedPhotos

);

showPhotos();

});

</script>


</body>

</html>

"""

path = Path("/mnt/data/edit.html")

path.write_text(edit_html, encoding="utf-8")

print("created", path)
