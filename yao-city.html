<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>八尾コース 市一覧</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="cityPage">
    <h1>八尾コース</h1>
    <button class="cityButton"
            onclick="selectCity('八尾市')">
        八尾市
    </button>
    <br><br>
    <button class="cityButton"
            onclick="selectCity('羽曳野市')">
        羽曳野市
    </button>
    <br><br>
    <button class="cityButton"
            onclick="selectCity('藤井寺市')">
        藤井寺市
    </button>
    <br><br>
    <button class="cityButton"
            onclick="selectCity('富田林市')">
        富田林市
    </button>
    <br><br>
    <button class="cityButton"
            onclick="selectCity('河南町')">
        河南町
    </button>
    <br><br>
    <button class="cityButton"
            onclick="selectCity('千早赤阪村')">
        千早赤阪村
    </button>
    <br><br>
    <button class="backButton"
            onclick="location.href='index.html'">
        🔙戻る
    </button>
    <script>
        function selectCity(city) {
            localStorage.setItem("currentCity", city);
            location.href = "town.html";
        }
    </script>
</body>
</html>
