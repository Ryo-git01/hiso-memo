<!DOCTYPE html>

<html lang="ja">

<head>


    <meta charset="UTF-8">

    <title>配送先詳細</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body class="detailPage">

<h1>配送先詳細</h1>

<div class="detailCard">

    <p id="address"></p>

    <button
        class="copyButton"
        onclick="copyAddress()">

        📋 住所をコピー

    </button>

    <div id="copyNotification"></div>

<h2>配送先メモ：</h2>

<div
    id="memo"
    class="memo-box">
</div>

</div>

<div class="photoPreview">

    <div class="photoItem">

        <img id="photo1">

    </div>

    <div class="photoItem">

        <img id="photo2">

    </div>

    <div class="photoItem">

        <img id="photo3">

    </div>

    <div class="photoItem">

        <img id="photo4">

    </div>

</div>

<br>

<div class="buttonGrid">

    <button onclick="goBack()">

        🔙戻る

    </button>

    <button onclick="location.href='edit.html'">

        ✍編集

    </button>

    <button onclick="goHome()">

        🏠 ホーム

    </button>

    <button onclick="openMap()">

        📍 Googleマップ

    </button>

</div>

<input
    id="photoInput"
    type="file"
    accept="image/*"
    multiple
    hidden>

<script src="compress-photo.js"></script>

<script>


const deliveries =

    JSON.parse(
        localStorage.getItem("deliveries")
    ) || [];

const currentDeliveryId =

    Number(
        localStorage.getItem("currentDeliveryId")
    );

const delivery =

    deliveries.find(function(item) {

        return item.id === currentDeliveryId;

    });

function showDeliveryData() {

    if (!delivery) {

        alert("配送先データが見つかりません。");

        location.href = "index.html";

        return;

    }

    document.getElementById("address").textContent =

        "住所：" +
        delivery.city + " " +
        delivery.town + " " +
        delivery.address;

    document.getElementById("memo").textContent =

        delivery.memo || "";

    showPhotos();

}

function showPhotos() {

    const photoElements = [

        document.getElementById("photo1"),

        document.getElementById("photo2"),

        document.getElementById("photo3"),

        document.getElementById("photo4")

    ];

    photoElements.forEach(function(photoElement) {

        photoElement.removeAttribute("src");

        photoElement.onclick = null;

        const photoItem =

            photoElement.parentElement;

        const oldAddButton =

            photoItem.querySelector(
                ".detailPhotoAddButton"
            );

        if (oldAddButton) {

            oldAddButton.remove();

        }

    });

    if (!Array.isArray(delivery.photos)) {

        delivery.photos = [];

    }

    delivery.photos.forEach(function(photo, index) {

        if (!photoElements[index]) {

            return;

        }

        photoElements[index].src = photo;

        photoElements[index].onclick = function() {

            localStorage.setItem(

                "selectedPhotoIndex",

                index

            );

            location.href = "photo.html";

        };

    });

    if (delivery.photos.length < 4) {

        const emptyIndex =

            delivery.photos.length;

        const emptyPhotoItem =

            photoElements[emptyIndex].parentElement;

        const addButton =

            document.createElement("button");

        addButton.type = "button";

        addButton.className =

            "detailPhotoAddButton";

        addButton.textContent = "＋📷";

        addButton.onclick = function() {

            document
                .getElementById("photoInput")
                .click();

        };

        emptyPhotoItem.appendChild(addButton);

    }

}

document
    .getElementById("photoInput")
    .addEventListener(
        "change",
        async function(event) {

            const selectedPhotos =

                Array.from(
                    event.target.files
                );

            if (selectedPhotos.length === 0) {

                return;

            }

            const photoCount =

                Array.isArray(delivery.photos)

                    ? delivery.photos.length

                    : 0;

            const remainingCount =

                4 - photoCount;

            if (remainingCount <= 0) {

                alert("写真は最大4枚までです。");

                event.target.value = "";

                return;

            }

            const targetPhotos =

                selectedPhotos.slice(
                    0,
                    remainingCount
                );

            try {

                const compressedPhotos =

                    await Promise.all(

                        targetPhotos.map(
                            function(file) {

                                return compressPhoto(file);

                            }
                        )

                    );

                if (!Array.isArray(delivery.photos)) {

                    delivery.photos = [];

                }

                delivery.photos.push(

                    ...compressedPhotos

                );

                localStorage.setItem(

                    "deliveries",

                    JSON.stringify(deliveries)

                );

                showPhotos();

            } catch (error) {

                console.error(error);

                alert("写真の追加に失敗しました。");

            }

            event.target.value = "";

        }
    );

function goBack() {

    const previousPage =

        localStorage.getItem("previousPage");

    const fromNew =

        localStorage.getItem("fromNew");

    if (fromNew === "true") {

        localStorage.removeItem("fromNew");

        location.href = "new.html";

        return;

    }

    if (previousPage === "search") {

        location.href = "search.html";

    } else if (previousPage === "address") {

        location.href = "address.html";

    } else {

        location.href = "index.html";

    }

}

function goHome() {

    localStorage.removeItem("fromNew");

    location.href = "index.html";

}

function openMap() {

    if (!delivery) {

        return;

    }

    const address =

        `${delivery.city} ${delivery.town} ${delivery.address}`;

    window.open(

        `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`,

        "_blank"

    );

}

function copyAddress() {

    if (!delivery) {

        return;

    }

    const address =

        `${delivery.city} ${delivery.town} ${delivery.address}`;

    const notification =

        document.getElementById("copyNotification");

    navigator.clipboard
        .writeText(address)
        .then(function() {

            notification.textContent =

                "📋住所をコピーしました";

            notification.style.opacity = "1";

            clearTimeout(notification.timer);

            notification.timer =

                setTimeout(function() {

                    notification.style.opacity = "0";

                }, 1000);

        })
        .catch(function(error) {

            console.error(error);

            alert("住所をコピーできませんでした。");

        });

}


showDeliveryData();

</script>

</body>

</html>
