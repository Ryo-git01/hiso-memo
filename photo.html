<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>写真観覧</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="photoPage">

<div class="photoViewer">

    <img id="photoView">

</div>

<div
    id="photoCounter"
    class="photoCounter">
</div>

<script>

const deliveries =

    JSON.parse(
        localStorage.getItem("deliveries")
    ) || [];

const currentDeliveryId =

    Number(
        localStorage.getItem("currentDeliveryId")
    );

const delivery =

    deliveries.find(function(item) {

        return item.id === currentDeliveryId;

    });

let selectedPhotoIndex =

    Number(
        localStorage.getItem("selectedPhotoIndex")
    );

if (
    !Number.isInteger(selectedPhotoIndex) ||
    selectedPhotoIndex < 0
) {

    selectedPhotoIndex = 0;

}

/* ================================
   写真の拡大・移動状態
================================ */

let scale = 1;

let translateX = 0;

let translateY = 0;

const MIN_SCALE = 1;

const MAX_SCALE = 4;

/* ================================
   タッチ操作の状態
================================ */

let startX = 0;

let startY = 0;

let startTranslateX = 0;

let startTranslateY = 0;

let touchStartTime = 0;

let lastTapTime = 0;

let isPinching = false;

let gestureWasPinch = false;

let initialPinchDistance = 0;

let initialPinchScale = 1;

/* ================================
   スワイプ・タップ設定
================================ */

const SWIPE_BACK_DISTANCE = 100;

const SWIPE_CHANGE_DISTANCE = 60;

const TAP_MOVE_LIMIT = 15;

const DOUBLE_TAP_TIME = 300;

/* ================================
   画面の要素
================================ */

const photoViewer =

    document.querySelector(".photoViewer");

const photoView =

    document.getElementById("photoView");

photoViewer.style.touchAction = "none";

photoView.style.transformOrigin = "center center";

/* ================================
   写真を1枚表示する
================================ */

function showPhoto() {

    if (
        !delivery ||
        !Array.isArray(delivery.photos) ||
        delivery.photos.length === 0
    ) {

        alert("表示できる写真がありません。");

        location.href = "detail.html";

        return;

    }

    if (selectedPhotoIndex >= delivery.photos.length) {

        selectedPhotoIndex =

            delivery.photos.length - 1;

    }

    photoView.src =

        delivery.photos[selectedPhotoIndex];

    document.getElementById("photoCounter").textContent =

        (selectedPhotoIndex + 1) +
        " / " +
        delivery.photos.length;

    localStorage.setItem(

        "selectedPhotoIndex",

        selectedPhotoIndex

    );

    resetPhotoView();

}

/* ================================
   写真の倍率と位置を画面へ反映する
================================ */

function applyPhotoTransform() {

    photoView.style.transform =

        `translate(${translateX}px, ${translateY}px)
         scale(${scale})`;

}

/* ================================
   写真を100％表示へ戻す
================================ */

function resetPhotoView() {

    scale = 1;

    translateX = 0;

    translateY = 0;

    applyPhotoTransform();

}

/* ================================
   前の写真を表示する
================================ */

function showPreviousPhoto() {

    if (selectedPhotoIndex <= 0) {

        return;

    }

    selectedPhotoIndex--;

    showPhoto();

}

/* ================================
   次の写真を表示する
================================ */

function showNextPhoto() {

    if (
        !delivery ||
        !Array.isArray(delivery.photos) ||
        selectedPhotoIndex >= delivery.photos.length - 1
    ) {

        return;

    }

    selectedPhotoIndex++;

    showPhoto();

}

/* ================================
   前の画面へ戻る
================================ */

function goBack() {

    history.back();

}

/* ================================
   2本の指の距離を計算する
================================ */

function getTouchDistance(touch1, touch2) {

    const distanceX =

        touch1.clientX - touch2.clientX;

    const distanceY =

        touch1.clientY - touch2.clientY;

    return Math.hypot(

        distanceX,

        distanceY

    );

}

/* ================================
   ダブルタップで段階的に拡大する
================================ */

function zoomWithDoubleTap() {

    if (scale < 2) {

        scale = 2;

    } else if (scale < 3) {

        scale = 3;

    } else {

        resetPhotoView();

        return;

    }

    applyPhotoTransform();

}

/* ================================
   指を置いたとき
================================ */

photoViewer.addEventListener(
    "touchstart",
    function(event) {

        touchStartTime = Date.now();

        if (event.touches.length === 2) {

            event.preventDefault();

            isPinching = true;

            gestureWasPinch = true;

            initialPinchDistance =

                getTouchDistance(

                    event.touches[0],

                    event.touches[1]

                );

            initialPinchScale = scale;

            return;

        }

        if (event.touches.length !== 1) {

            return;

        }

        startX =

            event.touches[0].clientX;

        startY =

            event.touches[0].clientY;

        startTranslateX = translateX;

        startTranslateY = translateY;

    },
    {
        passive: false
    }
);

/* ================================
   指を動かしているとき
================================ */

photoViewer.addEventListener(
    "touchmove",
    function(event) {

        if (
            isPinching &&
            event.touches.length === 2
        ) {

            event.preventDefault();

            const currentDistance =

                getTouchDistance(

                    event.touches[0],

                    event.touches[1]

                );

            const pinchRatio =

                currentDistance /
                initialPinchDistance;

            scale =

                initialPinchScale *
                pinchRatio;

            scale = Math.min(

                MAX_SCALE,

                Math.max(

                    MIN_SCALE,

                    scale

                )

            );

            if (scale === MIN_SCALE) {

                translateX = 0;

                translateY = 0;

            }

            applyPhotoTransform();

            return;

        }

        if (event.touches.length !== 1) {

            return;

        }

        event.preventDefault();

        if (scale <= 1) {

            return;

        }

        const currentX =

            event.touches[0].clientX;

        const currentY =

            event.touches[0].clientY;

        translateX =

            startTranslateX +
            currentX -
            startX;

        translateY =

            startTranslateY +
            currentY -
            startY;

        applyPhotoTransform();

    },
    {
        passive: false
    }
);

/* ================================
   指を離したとき
================================ */

photoViewer.addEventListener(
    "touchend",
    function(event) {

        if (gestureWasPinch) {

            if (event.touches.length === 0) {

                isPinching = false;

                gestureWasPinch = false;

            }

            return;

        }

        if (event.touches.length > 0) {

            return;

        }

        const endX =

            event.changedTouches[0].clientX;

        const endY =

            event.changedTouches[0].clientY;

        const moveX =

            startX - endX;

        const moveY =

            startY - endY;

        const absoluteMoveX =

            Math.abs(moveX);

        const absoluteMoveY =

            Math.abs(moveY);

        const touchDuration =

            Date.now() - touchStartTime;

        /* ダブルタップ判定 */

        if (
            absoluteMoveX < TAP_MOVE_LIMIT &&
            absoluteMoveY < TAP_MOVE_LIMIT &&
            touchDuration < DOUBLE_TAP_TIME
        ) {

            const currentTapTime =

                Date.now();

            if (
                currentTapTime - lastTapTime <
                DOUBLE_TAP_TIME
            ) {

                zoomWithDoubleTap();

                lastTapTime = 0;

            } else {

                lastTapTime = currentTapTime;

            }

            return;

        }

        /* 拡大中の操作 */

        if (scale > 1) {

    return;

}

        /* 通常表示中の上スワイプ */

        if (
            moveY > SWIPE_BACK_DISTANCE &&
            absoluteMoveY > absoluteMoveX
        ) {

            goBack();

            return;

        }

        /* 通常表示中の左右スワイプ */

        if (
            moveX > SWIPE_CHANGE_DISTANCE &&
            absoluteMoveX > absoluteMoveY
        ) {

            showNextPhoto();

            return;

        }

        if (
            moveX < -SWIPE_CHANGE_DISTANCE &&
            absoluteMoveX > absoluteMoveY
        ) {

            showPreviousPhoto();

        }

    },
    {
        passive: false
    }
);

/* ================================
   タッチ操作が途中で中断されたとき
================================ */

photoViewer.addEventListener(
    "touchcancel",
    function() {

        isPinching = false;

        gestureWasPinch = false;

    }
);

/* ================================
   ページを開いたときの最初の処理
================================ */

showPhoto();

</script>
</body>

</html>
