<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>写真閲覧</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<button onclick="location.href='detail.html'">
← 戻る
</button>

<h1>写真閲覧</h1>

<div class="photoViewer">

    <img id="photoView">

</div>

<div style="text-align:center;">
写真1/3
</div>

<br>

<div style="display:flex; justify-content:space-between;">
    <button>◀</button>
    <button>▶</button>
</div>

<br><br>

<div style="display:flex; justify-content:space-between;">
    <button>☑ 選択</button>

<button onclick="location.href='delete-confirm.html'">
    削除
</button></div>

<script>

const deliveries =
    JSON.parse(localStorage.getItem("deliveries")) || [];

const currentDeliveryId =
    Number(localStorage.getItem("currentDeliveryId"));

const delivery =
    deliveries.find(function(item){

        return item.id === currentDeliveryId;

    });

if (
    delivery &&
    delivery.photos &&
    delivery.photos.length > 0
) {

    document.getElementById("photoView").src =
        delivery.photos[0];

}

let startX = 0;
let startY = 0;

const SWIPE_BACK_DISTANCE = 300;
const SWIPE_CHANGE_DISTANCE = 120;

document.addEventListener("touchstart", function(e) {

    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;

});

document.addEventListener("touchend", function(e) {

    const endX = e.changedTouches[0].clientX;

    const moveX = startX - endX;

    const endY = e.changedTouches[0].clientY;

    const moveY = startY - endY;

    // 上へ300px以上スワイプしたら戻る

    const SWIPE_BACK_DISTANCE = 300;

if (moveY > SWIPE_BACK_DISTANCE) {

    location.href = "detail.html";

}

if (moveX > SWIPE_CHANGE_DISTANCE) {

    alert("← 左へスワイプ");

}

if (moveX < -SWIPE_CHANGE_DISTANCE) {

    alert("→ 右へスワイプ");

}

});


</script>

</body>
</html>
