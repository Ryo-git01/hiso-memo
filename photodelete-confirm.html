<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>写真削除確認</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="deletePage">

<h1>写真削除確認</h1>

<p>この写真を削除しますか？</p>

<p class="warning">
    ※削除したデータは元に戻せません。
</p>

<br>

<div class="deleteButtons">

    <button class="deleteButton" onclick="deletePhoto()
">
     🗑️削除
    </button>

    <button class="backButton" onclick="location.href='photodelete.html'
">
        キャンセル
    </button>

</div>

<script>

function deletePhoto() {

    const currentId =

        Number(
            localStorage.getItem("currentDeliveryId")
        );

    const selectedPhotoIndex =

        Number(
            localStorage.getItem("selectedPhotoIndex")
        );

    let deliveries =

        JSON.parse(
            localStorage.getItem("deliveries")
        ) || [];

  const delivery =

        deliveries.find(function(item) {

            return item.id === currentId;

        });

    if (

        !delivery ||

        !Array.isArray(delivery.photos)

    ) {

        return;

    }

  delivery.photos.splice(

        selectedPhotoIndex,

        1

    );

 localStorage.setItem(

        "deliveries",

        JSON.stringify(deliveries)

    );

    location.href = "edit.html";
    
}

</script>

</body>
</html>
