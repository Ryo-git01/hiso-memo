content = """<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>新規登録</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="newPage">

<h1>新規登録</h1>

<p>コース</p>

<select id="courseInput" onchange="updateCityList()">

</select>

<br><br>

<p>エリア</p>

<select id="cityInput" onchange="updateTownList()">

</select>

<br><br>

<p>地区</p>

<select id="townInput">

</select>

<br><br>

<p>住所</p>

<input id="addressInput"

       class="addressInput">

<br><br>

<p>配送先メモ</p>

<textarea id="memoInput"

          class="memoInput"></textarea>

<br><br>


<button
    id="photoButton"
    class="photoButton">

    📷 +写真

</button>

<br><br>

<div class="photoPreview">

    <div class="photoItem">
        <img id="photo1">
    </div>

    <div class="photoItem">
        <img id="photo2">
    </div>

    <div class="photoItem">
        <img id="photo3">
    </div>

    <div class="photoItem">
        <img id="photo4">
    </div>

</div>

<br>

<input
    type="file"
    id="photoInput"
    accept="image/*"
    multiple
    style="display: none;">

<br><br>

<button class="confirmButton" onclick="saveNewDestination()">

    ☐確認

</button>

<br><br>

<button class="backButton" onclick="location.href='index.html'">

    🔙戻る

</button>

<script src="coursedata.js"></script>

<script src="towndata.js"></script>

<script src="compress-photo.js"></script>

<script>

let pendingDelivery =

    JSON.parse(localStorage.getItem("pendingDelivery")) ||

    {

        photos: []

    };

function updateCourseList() {

    const courseSelect =

        document.getElementById("courseInput");

    courseSelect.innerHTML = "";

    Object.keys(courseData).forEach(function(course) {

        const option =

            document.createElement("option");

        option.value = course;

        option.textContent = course;

        courseSelect.appendChild(option);

    });

}

function updateCityList() {

    const course =

        document.getElementById("courseInput").value;

    const citySelect =

        document.getElementById("cityInput");

    citySelect.innerHTML = "";

    const cities =

        courseData[course] || [];

    cities.forEach(function(city) {

        const option =

            document.createElement("option");

        option.value = city;

        option.textContent = city;

        citySelect.appendChild(option);

    });

    updateTownList();

}

function updateTownList() {

    const course =

    document.getElementById("courseInput").value;

    const city =

        document.getElementById("cityInput").value;

    const townSelect =

        document.getElementById("townInput");

    townSelect.innerHTML = "";

    const towns =

        townData[course][city] || [];

    towns.forEach(function(town) {

        const option =

            document.createElement("option");

        option.value = town;

        option.textContent = town;

        townSelect.appendChild(option);

    });

    if (!towns.includes("その他")) {

        const option =

            document.createElement("option");

        option.value = "その他";

        option.textContent = "その他";

        townSelect.appendChild(option);

    }

}

function saveNewDestination() {

    const address =

        document.getElementById("addressInput").value;

    const memo =

        document.getElementById("memoInput").value;

    const course =

        document.getElementById("courseInput").value;

    const city =

        document.getElementById("cityInput").value;

    const town =

        document.getElementById("townInput").value;

    const deliveries =

        JSON.parse(localStorage.getItem("deliveries")) || [];

    const nextId =

        deliveries.length > 0

            ? deliveries[deliveries.length - 1].id + 1

            : 1;

    const newDelivery = {

        id: nextId,

        course: course,

        city: city,

        town: town,

        address: address,

        memo: memo,

        photos: pendingDelivery.photos

    };

    localStorage.setItem(

        "pendingDelivery",

        JSON.stringify(newDelivery)

    );

    localStorage.setItem("lastCourse", course);

    localStorage.setItem("lastCity", city);

    localStorage.setItem("fromNew", "true");

    location.href = "confirm.html";

}

function restoreLastSelection() {

    const lastCourse =

        localStorage.getItem("lastCourse");

    if (lastCourse && courseData[lastCourse]) {

        document.getElementById("courseInput").value =

            lastCourse;

    }

    updateCityList();

    const lastCity =

        localStorage.getItem("lastCity");

    const currentCourse =

        document.getElementById("courseInput").value;

    const cities =

        courseData[currentCourse] || [];

    if (lastCity && cities.includes(lastCity)) {

        document.getElementById("cityInput").value =

            lastCity;

    }

    updateTownList();

}

function restorePendingDelivery() {

    const pendingDelivery =

        JSON.parse(localStorage.getItem("pendingDelivery"));

    if (!pendingDelivery) {

        return false;

    }

    if (courseData[pendingDelivery.course]) {

        document.getElementById("courseInput").value =

            pendingDelivery.course;

    }

    updateCityList();

    const cities =

        courseData[pendingDelivery.course] || [];

    if (cities.includes(pendingDelivery.city)) {

        document.getElementById("cityInput").value =

            pendingDelivery.city;

    }

    updateTownList();

    const towns =

        townData[pendingDelivery.city] || [];

    if (

        towns.includes(pendingDelivery.town) ||

        pendingDelivery.town === "その他"

    ) {

        document.getElementById("townInput").value =

            pendingDelivery.town;

    }

    document.getElementById("addressInput").value =

        pendingDelivery.address || "";

    document.getElementById("memoInput").value =

        pendingDelivery.memo || "";
        
        showPhotos();

    return true;
    
}

function showPhotos() {

    const photoElements = [

        document.getElementById("photo1"),

        document.getElementById("photo2"),

        document.getElementById("photo3"),

        document.getElementById("photo4")

    ];

    photoElements.forEach(function(photo) {

        photo.removeAttribute("src");

    });

    if (!Array.isArray(pendingDelivery.photos)) {

        return;

    }

    pendingDelivery.photos.forEach(function(photo, index) {

        photoElements[index].src = photo;

    });

}

updateCourseList();

const restoredPending =

    restorePendingDelivery();

if (!restoredPending) {

    restoreLastSelection();

}

document.getElementById("photoButton")
.addEventListener("click", function () {

    const photoCount =

        Array.isArray(pendingDelivery.photos)

            ? pendingDelivery.photos.length

            : 0;

    if (photoCount >= 4) {

        alert("写真は最大4枚までです。");

        return;

    }

    document.getElementById("photoInput").click();

});

document.getElementById("photoInput")
.addEventListener("change", async function (event) {

    const selectedPhotos =

        Array.from(event.target.files);

const photoCount =

    Array.isArray(pendingDelivery.photos)

        ? pendingDelivery.photos.length

        : 0;

const remainingCount =

    4 - photoCount;

const targetPhotos =

    selectedPhotos.slice(0, remainingCount);

const compressedPhotos =

    await Promise.all(

        targetPhotos.map(function (file) {

            return compressPhoto(file);

        })

    );

pendingDelivery.photos.push(

    ...compressedPhotos

);

showPhotos();

});

</script>

</body>

</html>

"""

path = Path("/mnt/data/new.html")

path.write_text(content, encoding="utf-8")

print(f"created {path}")
